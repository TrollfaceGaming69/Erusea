; Development tuning for `php artisan serve` running against a bind mount.
;
; The project source lives on a host bind mount, so every request would
; otherwise re-stat and re-compile thousands of vendor/ files. Enabling
; opcache for the CLI SAPI lets the long-lived dev-server process keep
; compiled scripts in memory, and a large realpath cache cuts the repeated
; path lookups that dominate bind-mount I/O.

memory_limit = 512M

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

; Keep picking up code edits, but don't re-stat on every single request.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2

realpath_cache_size = 4096k
realpath_cache_ttl = 600
