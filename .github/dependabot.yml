version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
  - package-ecosystem: composer
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /docker/backend
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /docker/frontend
    schedule: { interval: weekly }